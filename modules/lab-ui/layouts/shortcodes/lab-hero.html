{{- $lab := site.Params.lab | default dict -}}
{{- $name := $lab.name | default site.Title -}}
{{- $tagline := $lab.tagline | default "" -}}
{{- $lead := $lab.lead | default "" -}}
<div class="lab-hero">
  <p class="lab-hero-brand">{{ $name }}</p>
  {{ with $tagline }}<h1 class="lab-hero-title">{{ . }}</h1>{{ end }}
  {{ with $lead }}<p class="lab-hero-lead">{{ . }}</p>{{ end }}
</div>
