{{- /* Sveltia CMS admin entry. Overrides blox-plugin-decap-cms single.html.
     Config is auto-generated from data/decap_cms_config.yaml → /admin/config.yml. */ -}}
<!doctype html>
<html lang="zh-cn">
<head>
  <meta content="noindex" name="robots">
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>内容管理 · {{ site.Title }}</title>
  <link rel="icon" href="{{ "icons/lab.svg" | relURL }}" type="image/svg+xml">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f5f4f8; }
    #lab-cms-fallback {
      display: none;
      max-width: 40rem;
      margin: 4rem auto;
      font-family: "DM Sans", "Noto Sans SC", system-ui, sans-serif;
      color: #2c2a25;
      line-height: 1.8;
    }
    #lab-cms-fallback code { background: #ecebf1; padding: 0.1em 0.4em; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="lab-cms-fallback">
    <h2>内容管理加载失败</h2>
    <p>无法加载 CMS 脚本（<code>/admin/sveltia-cms.js</code>）。请确认 <code>static/admin/sveltia-cms.js</code> 存在并已随站点发布，详见 <code>docs/CMS.md</code>。</p>
  </div>
  <script src="{{ "admin/sveltia-cms.js" | relURL }}"></script>
  <script>
    window.addEventListener('load', function () {
      if (!window.__sveltiaCMS && !document.querySelector('sveltia-cms, [data-sveltia]')) {
        // Sveltia mounts its UI into #root / custom element; if nothing appeared, show fallback.
        setTimeout(function () {
          if (!document.querySelector('#root, sveltia-cms') || document.querySelector('#root:empty')) {
            var fb = document.getElementById('lab-cms-fallback');
            if (fb) fb.style.display = 'block';
          }
        }, 4000);
      }
    });
  </script>
</body>
</html>
