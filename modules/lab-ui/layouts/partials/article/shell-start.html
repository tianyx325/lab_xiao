<article class="lab-article">
  <header class="lab-article-header">
    <div class="container">
      <h1 class="lab-article-title">{{ .Title }}</h1>
      {{ with .Scratch.Get "lab_article_byline" }}
      <p class="lab-article-byline">{{ . | safeHTML }}</p>
      {{ end }}
      {{ with .Scratch.Get "lab_article_dek" }}
      <p class="lab-article-dek">{{ . | markdownify | emojify }}</p>
      {{ end }}
      {{ with .Scratch.Get "lab_article_meta_tags" }}
      {{ partial "article/meta-tags.html" (dict "items" .) }}
      {{ end }}
    </div>
  </header>
  <div class="lab-article-body container">
