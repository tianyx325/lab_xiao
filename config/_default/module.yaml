############################
## HUGO MODULES
## Install or uninstall themes and plugins here.
## Docs: https://gohugo.io/hugo-modules/
############################

# Local reusable UI (no network). Keep code in modules/lab-ui.
# Note: do not mount module assets/scss (site keeps assets/scss/lab/_tokens.scss).
mounts:
  - source: modules/lab-ui/layouts
    target: layouts
  - source: modules/lab-ui/assets/js
    target: assets/js
  - source: modules/lab-ui/static
    target: static
  - source: modules/lab-ui/archetypes
    target: archetypes
  # Site defaults (required when custom mounts are declared)
  - source: layouts
    target: layouts
  - source: assets
    target: assets
  - source: static
    target: static
  - source: archetypes
    target: archetypes
  - source: content
    target: content
  - source: data
    target: data
  - source: i18n
    target: i18n

imports:
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-plugin-decap-cms
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-plugin-netlify
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-bootstrap/v5
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-core
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-seo
