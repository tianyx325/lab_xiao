# Lab type stack — clean blue-white academic:
# headings & body DM Sans + Noto Sans SC (system-ui fallback).
# Selected via config/_default/params.yaml → appearance.font: lab
# Keep google_fonts weights in sync with $lab-weight-* in assets/scss/lab/_tokens.scss

name = "Lab"

# display=swap appended by site_head — do not include it here (avoids duplicate)
google_fonts = "family=Source+Serif+4:opsz,wght@8..60,400;600;700&family=DM+Sans:opsz,wght@9..40,400;500;600&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600"

heading_font = "\"Source Serif 4\", \"Noto Serif SC\", Georgia, serif"
body_font = "\"DM Sans\", \"Noto Sans SC\""
nav_font = "\"DM Sans\", \"Noto Sans SC\""
mono_font = "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
