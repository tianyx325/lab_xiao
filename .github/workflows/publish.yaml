name: Deploy website to GitHub Pages

env:
  WC_HUGO_VERSION: '0.168.0'
  # GitHub Pages project site lives under /lab_xiao/; config baseURL stays
  # root-relative for local dev, so CI must override it here.
  SITE_BASE_URL: 'https://tianyx325.github.io/lab_xiao/'

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache_runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@daaf73efb31428f234303310b0d6d7a5f6e6c863 # v3
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true

      - name: Install Dart Sass
        run: echo "$(bash scripts/install-dart-sass.sh)" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --cleanDestinationDir --baseURL "${{ env.SITE_BASE_URL }}"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
