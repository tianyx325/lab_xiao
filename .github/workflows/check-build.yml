name: Check build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache_runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Dart Sass
        run: |
          curl -fsSL https://github.com/sass/dart-sass/releases/download/1.77.8/dart-sass-1.77.8-linux-x64.tar.gz | tar -xz
          echo "$PWD/dart-sass" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lab checks (theme / content / hardcodes)
        run: npm run check

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --cleanDestinationDir
