name: Check build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache_runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dart Sass
        run: echo "$(bash scripts/install-dart-sass.sh)" >> "$GITHUB_PATH"

      - name: Lab checks (theme / content / hardcodes)
        run: npm run check

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --cleanDestinationDir

      - name: Check internal links
        run: npm run check:links
