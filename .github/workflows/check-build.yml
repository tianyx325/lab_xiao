name: Check build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache_runner
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Install Dart Sass
        run: echo "$(bash scripts/install-dart-sass.sh)" >> "$GITHUB_PATH"

      - uses: actions/cache@v6
        with:
          path: /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Check color contrast
        run: python scripts/check_contrast.py

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify