name: Check build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache_runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@daaf73efb31428f234303310b0d6d7a5f6e6c863 # v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Install Dart Sass
        run: echo "$(bash scripts/install-dart-sass.sh)" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Install lint tooling
        run: npm ci

      - name: Lint SCSS
        run: npm run lint:css

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-checks.txt

      - name: Check color contrast
        run: python scripts/check_contrast.py

      - name: Validate content contracts
        run: |
          python -m pip install --quiet -r scripts/requirements-checks.txt
          python scripts/lint_content.py --quiet

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --cleanDestinationDir

      - name: Check performance budget
        run: python scripts/check_budget.py

      # Non-blocking reports: surface bilingual/content drift without failing
      # the build, so reviewers see the numbers while PRs can still merge.
      - name: Audit English pages (non-blocking)
        run: |
          python scripts/audit_en_pages.py || echo "::warning::EN page audit reported issues (see scripts/_audit_en_report.txt)"