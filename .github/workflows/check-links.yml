name: Check for broken links

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-links
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache_runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@daaf73efb31428f234303310b0d6d7a5f6e6c863 # v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Install Dart Sass
        run: echo "$(bash scripts/install-dart-sass.sh)" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --cleanDestinationDir

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Check links with linkinator
        run: |
          npx --yes linkinator@8.1.0 ./public \
            --recurse \
            --skip "^(https?://)?(localhost|127\.0\.0\.1)" \
            --skip "\.pdf$" \
            --skip "\.xml$" \
            --verbosity WARNING \
            2>&1 | tee linkinator-report.txt

      - name: Report results
        if: always()
        run: |
          if grep -q "ERROR" linkinator-report.txt 2>/dev/null; then
            grep "ERROR" linkinator-report.txt || true
            exit 1
          else
            echo "No broken links found."
          fi
