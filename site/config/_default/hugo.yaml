title: 智能感知与决策实验室
# 生产域名；GitHub Pages 由 CI 用 SITE_BASE_URL 覆盖为 /lab_xiao/ 子路径。
baseURL: 'https://lab.xaut.edu.cn/'

defaultContentLanguage: zh
hasCJKLanguage: true
defaultContentLanguageInSubdir: false
removePathAccents: true

enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 12
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
permalinks:
  authors: '/author/:slug/'
  tags: '/tag/:slug/'
  categories: '/category/:slug/'
  publication_types: '/publication-type/:slug/'
disableAliases: false
outputs:
  home: [HTML, RSS, WebAppManifest]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  anchor: smart
  jpeg:
    quality: 75
  webp:
    quality: 75
  avif:
    quality: 75
timeout: 600000
taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
markup:
  _merge: deep
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
security:
  _merge: deep
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^npx$'
      - '^node$'
      - '^npm$'
sitemap:
  _merge: deep
