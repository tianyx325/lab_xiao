        background: "#FFFFFF"
        foreground: "#000000"
      footer:
        background: "#F2FAFF"
        foreground: "#666666"

  dark:
    colors:
      primary: "#6B94EC"
      secondary: "#FFFFFF"
      neutral: "#AAAAAA"
    surfaces:
      background: "#030710"
      foreground: "#FFFFFF"
      header:
        background: "#161F34"
        foreground: "#FFFFFF"
      footer:
        background: "#030710"
        foreground: "#AAAAAA"
