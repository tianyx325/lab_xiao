# IPD Lab — LangChain-aligned ladders, brand #4176E6
hugoblox:
  meta:
    format: "hugoblox-theme@1"
    name: "IPD Lab"
    vendor: "lab-xiao"
    version: "1.1.0"
    license: "MIT"
    description: "Brand #4176E6 · CTA #BEB4FD · ink #000/#FFF · LC spacing"

  type: "dual"

  light:
    colors:
      primary: "#4176E6"
      secondary: "#000000"
      neutral: "#666666"
    surfaces:
      background: "#F2FAFF"
      foreground: "#000000"
