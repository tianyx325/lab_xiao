{{- $title := .Get "title" | default "" -}}
{{- $more := .Get "more" | default (cond (eq site.Language.Lang "en") "All" "全部") -}}
{{- $href := .Get "href" | default "" -}}
<div class="section-head">
  <h2>{{- $title -}}</h2>
  {{- with $href -}}
  <a href="{{ . | relURL }}">{{- $more -}}</a>
  {{- end -}}
</div>
